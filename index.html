<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub | منصة الألعاب العالمية</title>
<!-- مكتبة الأيقونات العالمية FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg: #070913;
    --bg2: rgba(15, 23, 42, 0.75);
    --card-bg: rgba(30, 41, 59, 0.7);
    --border: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --text2: #cbd5e1;
    --purple: #8b5cf6;
    --purple-glow: rgba(139, 92, 246, 0.4);
    --blue: #3b82f6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    scroll-behavior: smooth;
    overflow-x: hidden;
}

/* هيدر عصري بتأثير الزجاج */
header {
    height: 80px;
    background: var(--bg2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo { 
    font-size: 26px; 
    font-weight: 800; 
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #a855f7, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

nav { display: flex; gap: 25px; }
nav a { 
    color: var(--text2); 
    text-decoration: none; 
    font-size: 15px; 
    font-weight: 500;
    transition: 0.3s ease; 
    display: flex;
    align-items: center;
    gap: 8px;
}
nav a:hover { color: var(--purple); transform: translateY(-2px); }

.container { max-width: 1250px; margin: auto; padding: 30px 20px; }

/* القسم الرئيسي المطور */
.hero {
    min-height: 380px;
    border-radius: 24px;
    padding: 60px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: linear-gradient(90deg, rgba(7,9,19,0.95) 30%, rgba(7,9,19,0.4) 100%), 
                url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.hero-content { max-width: 600px; position: relative; z-index: 2; }
.hero h1 { font-size: 48px; font-weight: 900; margin: 15px 0; line-height: 1.2; }
.hero h1 span { color: var(--purple); }
.hero p { color: var(--text2); font-size: 18px; margin-bottom: 30px; }

.hero-button {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    border: none;
    color: white;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px var(--purple-glow);
    transition: 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}
.hero-button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 30px var(--purple-glow); }

/* عناوين الأقسام */
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 45px 0 20px;
}
.section-title h2 { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

/* الشبكة الخاصة بالألعاب */
.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
}

.game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(8px);
    position: relative;
}
.game-card:hover {
    transform: translateY(-10px);
    border-color: var(--purple);
    box-shadow: 0 15px 30px rgba(139, 92, 246, 0.25);
}

.game-img-wrapper {
    width: 100%;
    height: 180px;
    overflow: hidden;
    position: relative;
}

.game-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.game-card:hover .game-img-wrapper img { transform: scale(1.1); }

.game-info { padding: 20px; }
.game-info h3 { font-size: 18px; margin-bottom: 8px; }
.game-info p { color: var(--text2); font-size: 13px; margin-bottom: 15px; }

.rating {
    color: #f59e0b;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.details-btn {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    color: white;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 600;
}
.details-btn:hover { background: var(--purple); }
</style>
</head>

<body>

<header>
    <div class="logo">
        <i class="fa-solid fa-gamepad"></i> GAMEHUB
    </div>

    <nav>
        <a href="#home"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="#games"><i class="fa-solid fa-fire"></i> الألعاب</a>
    </nav>
</header>

<main class="container" id="home">

    <section class="hero">
        <div class="hero-content">
            <h1>عالم <span>الألعاب الرقمية</span> بأسلوب عالمي</h1>
            <p>تصفح المراجعات والتقييمات لأحدث وأقوى الألعاب العالمية</p>
            <button class="hero-button" onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">
                استكشف الآن <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </section>

    <div class="section-title" id="games">
        <h2><i class="fa-solid fa-bolt" style="color:var(--purple)"></i> أهم الألعاب</h2>
    </div>

    <section class="games" id="gamesGrid"></section>

</main>

<script>
// قاعدة بيانات مدعومة بروابط صور حقيقية من Unsplash
const games = [
    {
        name: "Grand Theft Auto V",
        desc: "عالم مفتوح • أكشن • مغامرة",
        rating: 9.5,
        img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80"
    },
    {
        name: "Cyberpunk 2077",
        desc: "عالم مفتوح • سايبربانك • RPG",
        rating: 9.0,
        img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80"
    },
    {
        name: "Forza Horizon",
        desc: "سباقات • عالم مفتوح • سيارات",
        rating: 9.3,
        img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80"
    },
    {
        name: "Fantasy RPG Adventure",
        desc: "عالم مفتوح • خيال • RPG",
        rating: 9.7,
        img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80"
    }
];

function renderGames() {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';

    games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <div class="game-img-wrapper">
                <img src="${game.img}" alt="${game.name}" loading="lazy">
            </div>
            <div class="game-info">
                <h3>${game.name}</h3>
                <p>${game.desc}</p>
                <div class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</div>
                <button class="details-btn">عرض التفاصيل</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

renderGames();
</script>

</body>
</html>
