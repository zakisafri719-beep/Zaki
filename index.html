<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub - الألعاب المميزة</title>
<style>
:root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
}

[data-theme="light"] {
    --bg-dark: #f1f5f9;
    --card-bg: #ffffff;
    --text-light: #0f172a;
    --text-muted: #64748b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    transition: background-color 0.3s, color 0.3s;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    font-family: system-ui, -apple-system, sans-serif;
    padding-bottom: 60px;
}

header {
    background-color: var(--card-bg);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: var(--accent);
}

.controls {
    display: flex;
    gap: 15px;
}

.theme-btn {
    background: none;
    border: 1px solid var(--text-muted);
    color: var(--text-light);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 30px 0;
    flex-wrap: wrap;
}

.filter-btn {
    background-color: var(--card-bg);
    color: var(--text-light);
    border: 1px solid var(--text-muted);
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
}

.filter-btn.active {
    background-color: var(--accent);
    border-color: var(--accent);
    color: white;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px;
}

.game-card {
    background-color: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.game-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.game-details {
    padding: 15px;
}

.game-title {
    font-size: 18px;
    margin-bottom: 8px;
}

.game-category {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 12px;
}

.rating {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: bold;
    color: #f59e0b;
}

#scrollTopBtn {
    position: fixed;
    bottom: 30px;
    left: 30px;
    background-color: var(--accent);
    color: white;
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    font-size: 18px;
}
</style>
</head>
<body>

<header>
    <div class="logo">GameHub</div>
    <div class="controls">
        <button class="theme-btn" onclick="toggleTheme()">تغيير المظهر</button>
    </div>
</header>

<div class="container">
    <div class="filters">
        <button class="filter-btn active" onclick="filterGames('all', this)">الكل</button>
        <button class="filter-btn" onclick="filterGames('action', this)">أكشن</button>
        <button class="filter-btn" onclick="filterGames('rpg', this)">آر بي جي</button>
        <button class="filter-btn" onclick="filterGames('sports', this)">رياضة</button>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
</div>

<button id="scrollTopBtn" onclick="scrollToTop()">↑</button>

<script>
const games = [
    {
        name: "Grand Theft Auto V",
        category: "action",
        categoryText: "أكشن / عالم مفتوح",
        rating: "9.5",
        img: "25746.jpg"
    },
    {
        name: "Minecraft",
        category: "action",
        categoryText: "بناء / مغامرة",
        rating: "9.0",
        img: "25781.png"
    },
    {
        name: "Red Dead Redemption 2",
        category: "action",
        categoryText: "أكشن / عالم مفتوح",
        rating: "9.8",
        img: "25749.jpg"
    },
    {
        name: "The Witcher 3",
        category: "rpg",
        categoryText: "آر بي جي / خيال",
        rating: "9.7",
        img: "25750.jpg"
    },
    {
        name: "Call of Duty: MW",
        category: "action",
        categoryText: "منظور أول / أكشن",
        rating: "8.8",
        img: "25771.jpg"
    },
    {
        name: "FIFA 24",
        category: "sports",
        categoryText: "رياضة / كرة قدم",
        rating: "8.2",
        img: "25757.jpg"
    },
    {
        name: "God of War: Ragnarök",
        category: "action",
        categoryText: "أكشن / مغامرة",
        rating: "9.6",
        img: "25779.jpg"
    },
    {
        name: "Elden Ring",
        category: "rpg",
        categoryText: "آر بي جي / عالم مفتوح",
        rating: "9.5",
        img: "25777.webp"
    },
    {
        name: "Fortnite",
        category: "action",
        categoryText: "باتل رويال",
        rating: "8.5",
        img: "25778.jpg"
    },
    {
        name: "Cyberpunk 2077",
        category: "rpg",
        categoryText: "آر بي جي / عالم مفتوح",
        rating: "8.9",
        img: "25747.jpg"
    }
];

function displayGames(filter = 'all') {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';

    const filteredGames = filter === 'all' 
        ? games 
        : games.filter(g => g.category === filter);

    filteredGames.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <img src="${game.img}" alt="${game.name}">
            <div class="game-details">
                <div class="game-title">${game.name}</div>
                <div class="game-category">${game.categoryText}</div>
                <div class="rating">★ ${game.rating}</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterGames(category, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    displayGames(category);
}

function toggleTheme() {
    const body = document.body;
    const currentTheme = body.getAttribute('data-theme');
    if (currentTheme === 'light') {
        body.removeAttribute('data-theme');
    } else {
        body.setAttribute('data-theme', 'light');
    }
}

window.onscroll = function() {
    const btn = document.getElementById('scrollTopBtn');
    if (document.documentElement.scrollTop > 200) {
        btn.style.display = 'block';
    } else {
        btn.style.display = 'none';
    }
};

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

displayGames();
</script>

</body>
</html>
